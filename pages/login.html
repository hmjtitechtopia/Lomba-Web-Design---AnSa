<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pusaka Bhumi Semarapura — Masuk</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #12100e;
      color: #e7e5e4;
    }
    .font-serif {
      font-family: 'Playfair Display', serif;
    }
  </style>
</head>
<body class="bg-[#12100e] text-stone-200 antialiased selection:bg-amber-500/30 selection:text-amber-200 overflow-x-hidden">

  <header class="fixed top-0 left-0 right-0 z-50 p-4 md:p-6 flex justify-center">
    <nav class="w-full max-w-7xl px-6 py-4 rounded-full flex items-center justify-between backdrop-blur-md bg-[#12100e]/70 border border-amber-500/20 shadow-[0_8px_32px_0_rgba(0,0,0,0.4)]">
      <a href="../index.html" class="text-xl md:text-2xl font-serif font-bold text-amber-100 tracking-wide hover:text-amber-300 transition">
        Pusaka Semarapura
      </a>
      <a href="../index.html" class="text-sm font-medium text-amber-300 hover:text-amber-100 transition">
        &larr; Kembali ke Beranda
      </a>
    </nav>
  </header>

  <main class="min-h-screen flex items-center justify-center py-32 px-4 sm:px-6">
    <div class="w-full max-w-md rounded-3xl bg-[#1c1917]/90 border border-amber-500/30 p-8 md:p-10 shadow-2xl">

      <div class="text-center mb-8">
        <span class="inline-block px-3 py-1 rounded-full text-xs font-bold uppercase tracking-[0.2em] text-amber-400 bg-amber-500/10 mb-3">Autentikasi</span>
        <h1 class="text-3xl md:text-4xl font-serif font-bold text-amber-50">Masuk Akun</h1>
        <p class="text-stone-400 text-sm mt-2">Selamat datang kembali, silakan masuk ke akun Anda</p>
      </div>

      <form id="login-form" class="space-y-5">
        <div>
          <label class="block text-sm font-semibold text-stone-300 mb-2">Email atau Username</label>
          <input id="login-email" type="text" placeholder="Masukkan email atau username..." required
            class="w-full px-4 py-3 rounded-xl bg-[#12100e] border border-amber-500/20 text-stone-200 placeholder-stone-500 focus:outline-none focus:border-amber-400 transition text-sm">
        </div>

        <div>
          <label class="block text-sm font-semibold text-stone-300 mb-2">Password</label>
          <input type="password" placeholder="••••••••" required
            class="w-full px-4 py-3 rounded-xl bg-[#12100e] border border-amber-500/20 text-stone-200 placeholder-stone-500 focus:outline-none focus:border-amber-400 transition text-sm">
        </div>

        <button type="submit"
          class="w-full py-3.5 mt-2 rounded-xl bg-amber-600 text-stone-950 font-bold hover:bg-amber-500 transition shadow-lg text-sm">
          Masuk
        </button>
      </form>

      <div class="text-center mt-6 text-xs text-stone-400">
        Belum punya akun? <a href="register.html" class="font-semibold text-amber-300 hover:underline">Daftar di sini</a>
      </div>

    </div>
  </main>

  <script>
    const loginForm = document.getElementById('login-form');
    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const emailVal = document.getElementById('login-email').value;
      localStorage.setItem('isLoggedIn', 'true');
      localStorage.setItem('pusakaActiveEmail', emailVal);

      let accounts = JSON.parse(localStorage.getItem('pusakaAccounts')) || {};
      let profile = accounts[emailVal] || JSON.parse(localStorage.getItem('pusakaProfile')) || {
        name: emailVal.split('@')[0] || 'Penjelajah Pusaka',
        email: emailVal,
        totalPoints: 0,
        scannedItems: 0,
        activities: [],
        quizCompleted: false,
        completedQuiz: null
      };
      profile.email = emailVal;
      accounts[emailVal] = profile;
      localStorage.setItem('pusakaAccounts', JSON.stringify(accounts));
      localStorage.setItem('pusakaProfile', JSON.stringify(profile));

      window.location.href = 'index.html';
    });
  </script>

</body>
</html>
