<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pusaka Bhumi Semarapura — Beranda Utama</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #12100e;
      color: #e7e5e4;
    }
    .font-serif {
      font-family: 'Playfair Display', serif;
    }
  </style>
</head>
<body class="bg-[#12100e] text-stone-200 antialiased overflow-x-hidden">

  <header class="fixed top-0 left-0 right-0 z-50 p-4 md:p-6 flex justify-center">
    <nav class="w-full max-w-7xl px-6 py-4 rounded-full flex items-center justify-between backdrop-blur-md bg-[#12100e]/70 border border-amber-500/20 shadow-[0_8px_32px_0_rgba(0,0,0,0.4)]">
      <a href="index.html" class="text-xl md:text-2xl font-serif font-bold text-amber-100 tracking-wide hover:text-amber-300 transition">
        Pusaka Semarapura
      </a>
      <div class="flex items-center space-x-3 sm:space-x-4">
        <a href="pages/login.html" class="px-5 py-2 rounded-full border border-amber-500/30 bg-amber-500/10 text-amber-200 text-sm font-semibold hover:bg-amber-500/20 transition">
          Masuk
        </a>
        <a href="pages/register.html" class="px-5 py-2 rounded-full bg-amber-600 text-stone-950 text-sm font-semibold hover:bg-amber-500 transition shadow-lg">
          Buat Akun
        </a>
      </div>
    </nav>
  </header>

  <main class="relative w-full h-screen overflow-hidden flex items-center justify-center text-center">
    <video
      autoplay
      loop
      muted
      playsinline
      class="absolute top-0 left-0 w-full h-full object-cover -z-10"
    >
      <source src="assets/vidieos/BackgroundUtama.mp4" type="video/mp4" />
      Browser Anda tidak mendukung video HTML5.
    </video>

    <div class="absolute inset-0 bg-gradient-to-t from-[#12100e] via-black/60 to-black/40 -z-10"></div>

    <div class="max-w-4xl mx-auto px-6 z-10 space-y-6">
      <span class="inline-block px-4 py-1.5 rounded-full bg-stone-900/60 backdrop-blur-md border border-amber-500/30 text-xs md:text-sm font-semibold tracking-widest uppercase text-amber-300">
        Pusaka Bhumi Semarapura
      </span>
      <h1 class="text-4xl sm:text-6xl md:text-7xl font-serif font-extrabold tracking-tight text-amber-50 leading-tight">
        Jelajahi Sejarah &amp; Kebudayaan Klungkung
      </h1>
      <p class="text-stone-300 text-base sm:text-lg md:text-xl font-light leading-relaxed max-w-2xl mx-auto">
        Portal informasi interaktif untuk mengenal warisan leluhur, tradisi, kuliner khas, dan artefak bersejarah dari Bumi Semarapura.
      </p>
      <div class="pt-4 flex flex-col sm:flex-row items-center justify-center gap-4">
        <a href="pages/login.html" class="w-full sm:w-auto px-8 py-3.5 rounded-full bg-amber-600 text-stone-950 font-bold text-base hover:bg-amber-500 transition shadow-xl">
          Masuk
        </a>
        <a href="pages/register.html" class="w-full sm:w-auto px-8 py-3.5 rounded-full border border-amber-500/40 bg-[#1c1917]/80 text-amber-200 font-semibold text-base hover:bg-amber-500/10 transition">
          Buat Akun
        </a>
      </div>
    </div>
  </main>

</body>
</html>
